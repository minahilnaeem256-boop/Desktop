<html>
    <head>
        <title>Simple Calculator</title>
        <style>
            body{
                background: lightyellow;
                font-size: 20px;
                font-family: Arial sans-serif;
            }
            #add{
                color: rgb(29, 108, 110);
            }
            #sub{
                color: rgb(42, 102, 55)
            }
            #mul{
                color: rgb(141, 43, 59)
            }
            #div{
                color: rgb(88, 25, 84)
            }
        </style>
    </head>
    <body>
        <h1>Simple Calculator</h1>
        <p>Perform the following operations with my calculator</p>
        <p id="add"></p>
        <p id="sub"></p>
        <p id="mul"></p>
        <p id="div"></p>

        <script>
            var num1 = 10;
            var num2= 5;
            var add = num1 + num2;
            var sub = num1 - num2;
            var mul = num1 * num2;
            var div = num1 / num2;

            document.getElementById("add").innerHTML=
            "the added value is:" + add;
            document.getElementById("sub").innerHTML=
            "the subtracted value is:" + sub;
            document.getElementById("mul").innerHTML=
            "the multiplied value is:" + mul;
            document.getElementById("div").innerHTML=
            "the divided value is:" + div;

        </script>
    </body>
</html>
