<html>
    <head>
        <title>Banking App</title>
    </head>
    <body>
        <div id="app">
            <h1 class="app-title">Heera's Bank</h1>
            <div class="balance-box">
                <p class="balance-label">Available Balance</p>
                <p class="balance">1000</p>
                <button class="history">Transaction history</button>
            </div>
        </br>

            <div class="entery-box">
                <label class="entery-label">Enter Amount</label>
                <input type="amount" id="amount" placeholder="enter amount">
            </div>
        </br>

            <div class="button-box">
                <button class="credit" id="credit-btn">Credit Button</button>
                <button class="debit" id="debit-btn">Debit Button</button>
            </div>

            <p id="note">Terms and Conditions Apply</p>
            <p id="message"></p>
        </div>
    </body>
</html>
