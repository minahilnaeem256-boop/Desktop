<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

        <style>
            body{
                background-image: linear-gradient(to bottom right, #3faa86, #1c776f);
                font-family: Arial;
                font-size: 20px;
                padding: 20px 15px;
            }
            h1{
                color: rgb(4, 37, 13);
                font-weight: bold;
                text-align: center;
                text-decoration: underline;
            }
            .club-card{
                background-color: rgb(201, 107, 154);
                color: rgb(90, 15, 65);
                border: 3px dashed white;
                border-radius: 15px;
                text-align: center;
                box-shadow: 4px 4px rgb(168, 129, 129);
                padding: 20px;
                margin-bottom: 20px;
            }
            .club-card h3{
                color: rgb(43, 8, 31);
                text-shadow: 4px 4px rgb(153, 98, 136);
            }
        </style>
    </head>
    <body>
        <h1>School Club Activities</h1>
        <div class="container">
            <div class="row">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="club-card">
                        <h3>Computer Lab</h3>
                        <p>In CS lab we learn coding and can play alot of online games that we enjoy.</p>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="club-card">
                        <h3>Art Room</h3>
                        <p>In the art room we unveil our imagination and create masterpieces.</p>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="club-card">
                        <h3>Library</h3>
                        <p>In the library we enter our fantasy world and live through by raeding.</p>
                    </div>
                </div>

            </div>
        </div>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js">
     </script>
    </body>
</html>
