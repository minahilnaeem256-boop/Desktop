<!DOCTYPE html>
<html>
    <head>
        <title>My Weather App Homepage</title>
         <link rel="stylesheet" href="./weatherforecast.css">
    </head>
    <body>
        <h1 style="color: darkblue";>My Weather App Homepage</h1>
        <div class="weather-card">
            <h2 style="color: white; text-align: center;">Today's Weather</h2>

        <div class="weather-icon">Cloudy</div>
          <div class="temperature">
            <p>28°C</p></div>
            <div class="details">
                <p>City: Lahore</p>
                <p>Condition: Partly Cloudy</p>
                <p>Humidity: 62%</p>
                <p>Wind Speed: 12 km/h</p>
            </div>
          </div>

          <h2 style="color:darkslateblue";>Weekly Forecast</h2>
          <div class="forecast-section">
            <h3 style="color: darkslateblue; text-align: center;">Next 5 Days</h3>
            <div class="day">
                <p>Monday: Sunny - 30°C</p>
                <p>Tuesday: cloudy - 27°C</p>
                <p>Wednesday: Sunny - 32°C</p>
                <p>Thursday: Windy - 25°C</p>
                <p>Friday: Rainy - 21°C</p>
            </div>
          </div>   
    </body>
</html>
