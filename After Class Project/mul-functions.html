<html>
    <head>
        <title>
            Multiplication using functions
        </title>
    </head>
    <body>
       <button type="button" onclick="multiply()">Multiply!</button>
       <p id="results"></p>
       <script>
        function multiply(){
            var a = 4;
            var b = 5;
            var results= a * b;
            document.getElementById("results").innerHTML = results;
        }
       </script>
    </body>
</html>
