<!DOCTYPE html>
<html>
    <body>
        <h1>Details of Users</h1>
        <form>
            <fieldset>
                <legend>Personal Information:</legend>
                <label>First Name:</label>
                <input type="text" id="fname" name="fname"><br><br>
                <label>Last Name:</label>
                <input type="text" id="1name" name="1name"><br><br>
                <label>Gender:</label><br><br>
                <input type="radio" name="subject" value="Male">Male<br><br>
                <input type="radio" name="subject" value="Female">Female<br><br>
                <input type="radio" name="subject" value="Other">Other<br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email"><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password"><br><br>
                <label for="birth date">Birth date:</label>
                <input type="data" id="birth date" name="birth date"><br><br>
                <label for="phone">Phone No:</label>
                <input type="tel" id="phone" name="phone"><br><br>
                <label for="email">Address:</label>
                <textarea rows="5" cols="50" name="description">Enter description here...</textarea>
                <br><br>
                <label for="image">Image</label>
                <input type="file" name="fileupload" accept="image/*" /><br><br>
                <centre>
                    <input type="submit" name="submit" value="submit"/>
                    <input type="reset" name="reset" value="reset"/>
                </centre>
            </fieldset>
        </form>      
    </body>
</html>
