<html>
    <head>
        <title>Loops in java script</title>
    </head>
    <body>
        <p>Numbers from 1 - 10</p>
        <p id="result"></p>
        <script>
            var number=" "
            for(let i = 1; i <= 10; i++)
            {
                number += i+ "<br>";
            }
               document.getElementById("result").innerHTML = number;
               document.write("the random value is " + Math.floor(Math.random()*100));
               document.write("<br>");
               var date= new Date();
               document.write("today's date is "+ date.getDate());
            
        </script>
    </body>
</html>
