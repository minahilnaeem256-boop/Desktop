<html>
    <head>
        <title>Calcularium</title>
        <link rel="stylesheet" href="calculator.css">
    </head>
    <body>
        <div class="fact-file">
        <div class="label">
         <label>number 1:</label></div>
        <input type="number" id="num1" placeholder="Enter first number">
        <br>
        <div class="label">
        <label>number 2:</label></div>
        <input type="number" id="num2" placeholder="Enter second number">
        <br>
        <br>
        <div class="all">
        <button type="button" onclick="add()">ADD</button>
        <button type="button" onclick="sub()">SUB</button>
        <button type="button" onclick="mul()">MUL</button>
        <button type="button" onclick="div()">DIV</button>
        <button type="button" onclick="reset()">RESET</button>
        </div>
        <br><br>
        <div class="end">
        <p id="result">The result appears here:</p></div>
        </div>
    <script>

            function getNumbers(){
                let number1= Number(document.getElementById("num1").value);
                let number2= Number(document.getElementById("num2").value);
                return[number1, number2];                
                   
            }
            function add(){
               let [number1, number2]= getNumbers();
               let result= number1+number2;
               document.getElementById("result").innerHTML = "Result: " + result;
            }
            function sub(){
                let [number1, number2]= getNumbers();
                let result= number1-number2;
                document.getElementById("result").innerHTML="Result:" + result;
            }
            function mul(){
               let [number1, number2]= getNumbers();
               let result= number1*number2;
               document.getElementById("result").innerHTML="Result:"+ result;
            }
            function div(){
                let [number1,number2]= getNumbers();
                if(number2 === 0){
                    document.getElementById("result").innerHTML="cannot divide by zero";
                    return;
                }
                let result= number1/number2;
                document.getElementById("result").innerHTML="Result:" +result;
            }
            function reset() {
                document.getElementById("num1").value = "";
                document.getElementById("num2").value = "";
                document.getElementById("result").innerHTML = "The result appears here:";
            }

            
            

    </script>
    </body>
</html>
