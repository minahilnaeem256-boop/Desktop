<html>
    <head>
        <title>My Hobbies</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <style>
            body{
                background-color: lightpink;
                font-family: arial;
                padding: 20px;
            }
            h1{
                font-size: 20px;
                font-weight: bold;
                color: rgb(165, 32, 54);
                text-align: center;
            }
            .hobby{
                background-color: beige;
                text-align: center;
                border: 2px solid orange;
                border-radius: 15px;
                padding: 20px;
                margin-bottom: 20px;
            }
            .hobby h3{
                color: rgb(68, 16, 68);
            }
        </style>
    </head>
    <body>
        <h1>MY Hobby Cards</h1>
        <div class="container">
            <div class="row">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby">
                        <h3>Reading</h3>
                        <p>Reading is a great hooby and it improves vocabulary.</p>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby">
                        <h3>Painting</h3>
                        <p>Painting makes you creative and i love to paint canvases.</p>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby">
                        <h3>Baking</h3>
                        <p>I love baking and trying new recipes.</p>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js">
 </script>

 </body>
</html>
