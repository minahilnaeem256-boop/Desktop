<html>
    <head>
        <title>Selector page</title>
        <style>
            body{
                font-family: Arial;
                padding: 20px; 
                background: beige;
                text-align: center;
            }
            h1{ 
                color: crimson;
                transform: rotate(20deg);
            }
            h1+p{
                padding: 10px 20px;
                border-radius: 8px;
                color: rgb(196, 157, 85);
                display: inline-block;
                background: lightyellow;
            }
            ul{
                padding: 0;
                margin-top: 20px;
            }
            ul>li{
                list-style: none;
                font-size: 18px;
                font-weight: bold;
                color: brown;
                padding: 10px 20px;
                margin: 6px auto;
                width: 260px;
                background: #e0bf89;
                border-radius: 8px;
            }
            ul li:nth-child(3){
                background:#ffe082;
                color: lightsalmon;
            }
            .desc{
                color: grey;
                margin-top: 20px;
                font-size: 15px;
                margin-left: auto;
                margin-right: auto;
                max-width: 400px;
            }
            .desc::first-letter{
                font-size: 100;
                color: orange;
                font-weight: bold;
            }
            .links{
                margin-top: 25px;
            }
            a{
                color: darksalmon;
                text-decoration: none;
                font-size: 15px;
                margin:0 12px;
                padding: 8px 18px;
                border: 2px solid darksalmon;
                border-radius: 8px;
            }
            a:hover{
                background: darksalmon;
                color: white;
            }

        </style>
         </head>
    <body>
        <h1>My Food Menu</h1>
        <p>pick your favourite dish and dig in!</p>
        <ul>
            <li>Pizza</li>
            <li>Burger</li>
            <li>Tacos-Chef's Special</li>
            <li>Fries</li>
            <li>Ice-cream</li>
        </ul>
        <p class="desc">Every dish on the menu is made with love and loads of flavour.</p>
        <div class="links">
            <a href="#">Order Now</a>
            <a href="#">See More</a>
        </div>
    </body>
</html>
