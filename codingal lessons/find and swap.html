<html>
    <head>
        <title>Find and Swap</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <style>
            body {
                background: lightpink;
            }


             h1,h3 {
                color:rgb(206, 35, 64);
            }
            .box {
                background: white;
                color: rgb(182, 16, 72);
            }

        </style>
    </head>
        <body>
            <div class="container py-4">
                <h1 class="mb-1">Activity 3: find and swapa word</h1>
            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">find and swap</h3>
                      <p>Sentence: "The dragon flew over the big castle."</p>
                      <input id="findW" class="form-control mb-2" placeholder = "word to find">
                      <input id="swapW" class="form-control mb-2" placeholder="word to swap">
                      <button class="btn btn-danger" onclick="doReplace()">SwapIt!</button>
                      <div id="srResult" class="box p-3 mt-3 rounded"></div>  
                </div>
            </div>    
            </div>

            <script>
                var sen= "the dragon flew over the big castle.";
                function doReplace(){
                    var findWord = document.getElementById("findW").value;
                    var swapWord = document.getElementById("swapW").value;
                    
                    if(sen.search(findWord) === -1){
                        document.getElementById("srResult").innerHTML = "'" + findWord + 
                        "' is not in the sentence - try another word";
                    } else{
                        document.getElementById("srResult").innerHTML = "new sentence:" +
                        sen.replace(findWord, swapWord);
                    }
                }
            </script>
        </body>
</html>
