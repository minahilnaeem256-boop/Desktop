<html>
    <head>
        <meta name="viewport" contenet="width=device-width, initial-scale=1.0">
        <title>flexboxes</title>
        <style>
            .logo{
                font-size: 30px;
                font-weight: bold;
            }
            .header{
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: rgb(7, 51, 87);
                color: white;
                padding: 20px;
            }
            a{
                text-decoration: none;
                color: white;
            }
            @media (min-width: 200px) and (max-width: 550px) {
                .header{
                    flex-direction: column;
                    align-items: flex-start;
                    color: rgb(142, 187, 223);
                }
                a{
                    display: flex;
                    flex-direction: column;
                    color: yellow;
                }
            }
        </style>
    </head>
    <body>
        <div class="header">
            <span class="logo">My Website</span>
            <header>
                <a href="#health">Stay Healthy</a>
                <a href="#tips">Quick Tips</a>
                <a href="#media">Watch &amp Learn</a>
            </header>
            <div class="menu">
            </div>
        </div>
    </body>
</html>
