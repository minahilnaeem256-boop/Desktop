<html>
    <head>
        <title>LOOPS!!!</title>
    </head>
    <body>
        <label>Number:</label>
        <input type="number" id="num" onchange="getNumber(event)">
        <button type="button" onclick="run()">RUN</button>
        <script>
            var number=0;
            function getNumber(e){
                number = e.target.value
            }
            function run(){
                for(let i= 1; i<=10; i++){
                   var result= number*i;
                   console.log(result);
                }
            }
        </script>
    </body>
</html>
