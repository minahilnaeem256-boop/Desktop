<html>
    <head>
        <title>score page</title>
        <style>
            body{
                background: rgb(127, 231, 167);
                text-align: center;
                padding: 20px;
                font-family: arial;
            }
            h1{
                color: rgb(10, 59, 29);
            }
            button{
                background: rgb(10, 59, 29);
                color: white;
                padding: 10px 20px;
                border: 2px dashed pink;
                border-radius: 15px;
                cursor: pointer;
            }
            button:hover{
                transform: scale(1.1);
            }
            div{
                border: 3px solid rgb(10, 59, 29);
                width: 280px;
                margin: 6px auto;
                padding: 8px 12px;
                text-align: left;
                border-radius: 6px;
            }
        </style>
    </head>
    <body>
        <h1>My Game Profile</h1>
        <button onclick="showProfile()">Show Profile</button>


        <div>Name: <span id="name"></span></div>
        <div>Score: <span id="score"></span></div>
        <div>TopScore: <span id="topscore"></span></div>
        <div>Rank: <span id="rank"></span></div>
        <div>Stars: <span id="stars"></span></div>
        <div>Greeting:<span id="greeting"></span></div>
        <script>
            function showProfile(){
                let name = "Ana";
                let myScore= 80;
                let highScore= 100;
                let team;
                
                let TopScore= myScore == highScore;

                let rank;
                if(myScore >= 80){
                    rank="Gold";
                }
                else if(myScore>=50){
                    rank = "silver";
                }
                else{
                    rank = "Bronze";
                }

                let hour= new Date().getHours();
                let greeting;
                if(hour < 12){
                    greeting = "Good Morning!";
                }
                else if(hour < 17){
                    greeting = "Good Afternoon!";
                }
                else{
                    greeting= "Good Evening!";
                }

                let stars="";
                let count= 0;
                while(count< 5){
                    stars= stars + "*";
                    count=count+1;
                }

                document.getElementById("name").innerHTML=name;
                document.getElementById("score").innerHTML=myScore + " out of " + highScore;
                document.getElementById("topscore").innerHTML= TopScore;
                document.getElementById("rank").innerHTML=rank;
                document.getElementById("stars").innerHTML= stars;
                document.getElementById("greeting").innerHTML= greeting;
        
            }
        </script>
    </body>
</html>
