<!DOCTYPE html>
<html>
    <head>
        <title>My Superhero Card</title>
        <style>
            body{
                background-color: darkblue;
                color: white;
                font-family: Arial, sans-serif;
            }
            .hero-name{
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 3px 3px orange;
            }
            .tag-line{
                font-style: italic;
                color: lightblue;
                text-transform: capitalize;
                word-spacing: 2px;
                line-height: 2;
            }
            .label{
                text-transform: uppercase;
                text-decoration: underline;
                color: coral;
            }
            .power{
                font-weight: bold;
                color: lightgreen;
                letter-spacing: 2px;
            }
            .weakness{
                text-decoration: line-through;
                color: gray;
                letter-spacing: 2px;
            }
            .badge{
                font-size: 28px;
                font-weight: bold;
                color: gold;
                transform: rotate(15deg);
            }
            .made-by{
                color: coral;
                font-size: italic;
            }
        </style>
    </head>
    <body>
            <h1 class="hero-name">Thunder Kid</h1>
            <p class="tag-line">The Most Powerful Hero In The School</p>
            <h2 class="label">Super powers</h2>
            <p class="power">
                Can run fast like a Cheetah.</p>
            <p class="power">
                Can lift a school bus.</p>
            <h2 class="label">Weaknesses</h2>
            <p class="weakness">
                Maths Homework</p>
            <p class="weakness">
                Broccoli</p>
            <p class="badge">Top Hero</p>
    </body>
</html>
