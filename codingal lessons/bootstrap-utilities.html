<html>
    <head>
        <title>My Science Lab</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    </head>
    <body>
    <div class="container-fluid">
        <div class="jumbotron jumbotron-fluid bg-light text-left p-3">
            <h1 class="text-danger">My Science Lab</h1>
            <p>Welcome to the lab, here we run fun experiments and do some very fun activities</p>
            <button class="btn btn-info">Chemistry</button>
            <button class="btn btn-success">Biology</button>
            <button class="btn btn-danger">Physics</button>
            <button class="btn btn-warning">Astrology</button>
        </div>
            <h1 class="text-danger">Experiments Completed <span class="badge badge-danger">4</span>
            </h1>
            <p>Chemistry <span class="badge badge-pill badge-info">7 experiments</span></p>
            <p>Biology <span class="badge badge-pill badge-success">5 experiments</span></p>
            <p>Physics <span class="badge badge-pill badge-danger text-dark">6 experiments</span></p>
            <p>Astrology <span class="badge badge-pill badge-warning">3 experimets</span></p>
            <h1 class="text-danger">Research Progress</h1>
            <p>Chemistry</p>
            <div class="progress mb-3">
            <div class="progress-bar bg-info" style="width:85%">
                85%
            </div>
            </div>
            <p>Biology</p>
            <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width:70%">
                70%
            </div>
            </div>
            <p>Physics</p>
            <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width:40%">
                40%
            </div>
            </div>
            <p>Astology</p>
            <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width:30%">
                30%
            </div>
            </div>
    </div>
    </body>
</html>
